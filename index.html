<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- ============================================================ -->
    <!-- SECURITY HEADERS                                             -->
    <!-- ============================================================ -->

    <!-- Content Security Policy — fallback for non-Vercel environments.
         In production (Vercel), HTTP headers in vercel.json take precedence.
         NOTE: frame-ancestors is intentionally omitted here because browsers
         ignore it in <meta> CSP tags per spec (W3C CSP Level 2 §4.6).
         Clickjacking protection (frame-ancestors 'none' + X-Frame-Options: DENY)
         is enforced via real HTTP headers in vercel.json and public/_headers. -->
    <meta http-equiv="Content-Security-Policy" content="
      default-src 'self';
      script-src 'self';
      worker-src 'self' blob:;
      style-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net https://fonts.googleapis.com;
      font-src 'self' https://fonts.gstatic.com https://cdn.jsdelivr.net data:;
      img-src 'self' data: blob: https://lh3.googleusercontent.com https://*.supabase.co;
      media-src 'self' blob: https://*.supabase.co https://res.cloudinary.com;
      connect-src 'self' https://*.supabase.co wss://*.supabase.co https://api.ipify.org;
      base-uri 'self';
      form-action 'self';
    " />

    <!-- Prevents MIME-type sniffing attacks -->
    <meta http-equiv="X-Content-Type-Options" content="nosniff" />

    <!-- Controls referrer info sent when navigating away -->
    <meta http-equiv="Referrer-Policy" content="strict-origin-when-cross-origin" />

    <!-- ============================================================ -->
    <!-- GOOGLE FONTS (Marcellus & JetBrains Mono)                     -->
    <!-- ============================================================ -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Marcellus&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet" />

    <link rel="icon" type="image/png" href="/images/CCIS-Logo.png" />
    <title>CCIS Centralized Website</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
