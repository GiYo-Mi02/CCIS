<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- ============================================================ -->
    <!-- SECURITY HEADERS                                             -->
    <!-- ============================================================ -->

    <!-- Content Security Policy — fallback for non-Vercel environments.
         In production (Vercel), HTTP headers in vercel.json take precedence. -->
    <meta http-equiv="Content-Security-Policy" content="
      default-src 'self';
      script-src 'self' 'unsafe-inline';
      style-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net https://fonts.googleapis.com;
      font-src 'self' https://fonts.gstatic.com https://cdn.jsdelivr.net data:;
      img-src 'self' data: blob: https://lh3.googleusercontent.com https://*.supabase.co;
      connect-src 'self' https://*.supabase.co wss://*.supabase.co;
      frame-ancestors 'none';
      base-uri 'self';
      form-action 'self';
    " />

    <!-- Prevents MIME-type sniffing attacks -->
    <meta http-equiv="X-Content-Type-Options" content="nosniff" />

    <!-- Prevents this page from being embedded in iframes (clickjacking) -->
    <meta http-equiv="X-Frame-Options" content="DENY" />

    <!-- Controls referrer info sent when navigating away -->
    <meta http-equiv="Referrer-Policy" content="strict-origin-when-cross-origin" />

    <!-- ============================================================ -->
    <!-- GOOGLE FONTS (Marcellus & JetBrains Mono)                     -->
    <!-- ============================================================ -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Marcellus&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet" />

    <link rel="icon" type="image/png" href="/images/CCIS-Logo.png" />
    <title>CCIS Centralized Website</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
